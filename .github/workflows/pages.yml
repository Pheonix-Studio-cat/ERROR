# Veroeffentlicht die Seite auf GitHub Pages.
#
# Die Seite ist statisch und braucht keinen Build - das Repo-Root wird
# unveraendert hochgeladen. Der erste Lauf aktiviert Pages selbst
# (configure-pages mit enablement), danach deployt jeder Push auf main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Laufende Deployments nicht abbrechen, aber auch nicht doppelt starten.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
