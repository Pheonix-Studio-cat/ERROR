<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ERROR</title>
    <meta
      name="description"
      content="ERROR - a website that pretends to be completely broken. It is not. Only errors, around the clock."
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#06070a" />

    <!-- Favicon als Inline-SVG: keine externen Bilder nötig. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2306070a'/%3E%3Ctext x='16' y='23' font-family='monospace' font-size='20' font-weight='bold' fill='%23ff3b47' text-anchor='middle'%3E!%3C/text%3E%3C/svg%3E"
    />

    <link rel="stylesheet" href="./src/styles/base.css" />
    <link rel="stylesheet" href="./src/styles/terminal.css" />
    <link rel="stylesheet" href="./src/styles/effects.css" />
    <link rel="stylesheet" href="./src/styles/glitch.css" />
  </head>
  <body>
    <!-- Die App baut sich vollständig in diesen Container. -->
    <div id="app"></div>

    <!-- Ohne JavaScript gibt es trotzdem einen Fehler. Versprochen. -->
    <noscript>
      <div class="screen">
        <div class="term">
          <div class="term__line"><span class="accent bold">error.sys 0.9.1-beta</span></div>
          <div class="term__line"><span class="faint">Only errors. Around the clock.</span></div>
          <div class="term__line">&nbsp;</div>
          <div class="term__line"><span class="dim">[--:--:--] </span><span class="red bold">FATAL  ERROR JS</span><span> · JavaScript disabled.</span></div>
          <div class="term__line">&nbsp;</div>
          <div class="term__line"><span class="dim">  Without JavaScript we cannot deliver random errors.</span></div>
          <div class="term__line">&nbsp;</div>
          <div class="term__line"><span class="joke">  &ldquo;The only real error on this site.&rdquo;</span></div>
          <div class="term__line"><span class="joke">  &ldquo;Of course.&rdquo;</span></div>
        </div>
      </div>
    </noscript>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
